name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml with the example vault
        run: docker compose config --quiet
      - name: Validate docker-compose.yml with a custom vault path
        run: VAULT_PATH=/tmp/vault TIMEZONE=UTC docker compose config | grep -q '/tmp/vault/Inbox'
